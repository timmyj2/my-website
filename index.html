<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tim's Learning Roadmaps</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Self-built, interactive reference roadmaps for agentic analytics engineering.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;
  --surface:#0f0f11;
  --tint:rgba(255,255,255,.024);
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --text:#f2f3f5;
  --mut:#a1a5ad;
  --dim:#6a6e77;
  --accent:#e8e9ec;
  --body:'Inter',system-ui,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#fbfbfa;
    --surface:#ffffff;
    --tint:rgba(0,0,0,.018);
    --line:rgba(0,0,0,.1);
    --line-strong:rgba(0,0,0,.2);
    --text:#121316;
    --mut:#5c6069;
    --dim:#8b9098;
    --accent:#121316;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--body);font-size:16px;line-height:1.6;
  letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
::selection{background:var(--text);color:var(--bg)}

.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}

nav{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .3s ease;
}
nav.stuck{border-bottom-color:var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.mark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.94rem;letter-spacing:-.02em}
.mark .dot{width:9px;height:9px;border-radius:50%;background:var(--text);flex:none}
.navlinks{display:flex;gap:26px;font-family:var(--mono);font-size:.76rem;letter-spacing:.02em;color:var(--dim)}
.navlinks a{position:relative;padding:2px 0;transition:color .18s ease}
.navlinks a:hover{color:var(--text)}
.navlinks a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .22s ease}
.navlinks a:hover::after{transform:scaleX(1)}
@media (max-width:600px){.navlinks a:first-child{display:none}}
</style>
</head>
<body>
<nav id="nav">
  <div class="wrap">
    <a class="mark" href="#top"><span class="dot"></span>Tim's tool-belt</a>
    <div class="navlinks">
      <a href="#notes">Notes</a>
      <a href="#roadmaps">Roadmaps</a>
      <a href="#play">Play</a>
      <a href="reports/">Reports</a>
    </div>
  </div>
</nav>
<p class="wrap" style="padding-top:24px;color:#a1a5ad">If you see this stub, the homepage CSS was truncated in a tool call. Restore index.html from main and only add the Reports nav link.</p>
</body>
</html>
