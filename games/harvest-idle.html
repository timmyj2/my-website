<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Harvest Idle</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#12161d; --line:#252c37; --text:#e8ebf1; --mut:#9aa4b3; --dim:#6b7686;
    --leaf:#4ade80; --soil:#5b3a29; --gold:#f2c94c;
    --mono:'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--mono);
    display:flex;flex-direction:column;align-items:center;
    height:100vh;height:100dvh;
    background-image:radial-gradient(900px 420px at 15% -8%, rgba(74,222,128,.07), transparent 60%),
                     radial-gradient(900px 420px at 85% -8%, rgba(242,201,76,.08), transparent 60%);
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  a{color:inherit;text-decoration:none}

  .topbar{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;
    padding:8px 14px;flex:0 0 auto;gap:10px}
  .topbar a{font-size:.72rem;color:var(--mut)}
  .topbar a:hover{color:var(--text)}
  .topbar .ttl{font-size:.72rem;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
  .topbar .stats{display:flex;align-items:center;gap:12px;font-size:.78rem}
  .topbar .coins{color:var(--gold);font-weight:600;display:flex;align-items:center;gap:5px}
  .topbar .coins .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
  .topbar .plots{color:var(--dim);font-size:.7rem}

  .offline-banner{display:none;width:100%;max-width:640px;background:var(--panel2);border:1px solid var(--leaf);
    border-radius:12px;padding:10px 16px;margin:0 14px 6px;font-size:.78rem;color:var(--text);flex:0 0 auto}
  .offline-banner b{color:var(--leaf)}
  .offline-banner button{margin-top:6px;background:transparent;border:1px solid var(--line);border-radius:7px;
    padding:4px 10px;font-family:var(--mono);font-size:.68rem;color:var(--mut)}

  .stage{flex:1 1 auto;width:100%;position:relative;min-height:0;touch-action:none}
  canvas#game{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:block;border-radius:14px;
    background:var(--panel2);
    box-shadow:0 10px 34px rgba(0,0,0,.55), inset 0 0 0 2px #1d242e;
    outline:2px solid #1d242e;outline-offset:-2px;
  }

  .pad{width:100%;max-width:640px;flex:0 0 auto;padding:10px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;min-width:84px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
    border-left:3px solid var(--chipaccent,var(--leaf));transition:border-color .15s ease,background .15s ease}
  .chip .ico{font-size:1.15rem;line-height:1}
  .chip .nm{font-size:.68rem;color:var(--mut)}
  .chip .cost{font-size:.64rem;color:var(--dim)}
  .chip.active{background:rgba(74,222,128,.1);border-color:var(--leaf)}
  .chip.active .nm{color:var(--text)}
  .chip.locked{opacity:.45}
  .chip.locked .cost{color:var(--dim);font-size:.6rem}

  .controlrow{display:flex;align-items:center;gap:10px}
  .plantall{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;
    font-family:var(--mono);font-size:.8rem;color:var(--text);text-align:center;transition:border-color .15s ease}
  .plantall:hover:not(:disabled){border-color:var(--leaf)}
  .plantall:disabled{opacity:.4;cursor:not-allowed}

  .hint{max-width:640px;text-align:center;font-size:.62rem;color:var(--dim);
    padding:0 16px 10px;line-height:1.5;flex:0 0 auto}
  @media (max-height:640px){ .hint{display:none} }

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(0);background:var(--panel);
    border:1px solid var(--leaf);border-radius:12px;padding:12px 20px;font-family:var(--mono);font-size:.82rem;
    color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:60;opacity:0;pointer-events:none;
    transition:opacity .3s ease,transform .3s ease}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .toast b{color:var(--leaf)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="topbar">
    <a href="../index.html">&larr; Back</a>
    <span class="ttl">Harvest Idle</span>
    <div class="stats">
      <span class="plots" id="plotsVal">4/30 plots</span>
      <span class="coins"><span class="dot"></span><span id="coinVal">0</span></span>
    </div>
  </div>

  <div class="offline-banner" id="offlineBanner">
    <div id="offlineText"></div>
    <button data-action="dismiss-offline">Dismiss</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="620" height="360"></canvas>
  </div>

  <div class="pad">
    <div class="chiprow" id="cropChips"></div>
    <div class="controlrow">
      <button class="plantall" id="plantAllBtn" data-action="plant-all">Plant all empty plots</button>
    </div>
  </div>
  <div class="hint">Tap an empty plot to plant &middot; tap a glowing plot to harvest &middot; tap a locked plot to unlock it</div>

<div class="toast" id="toast"></div>

<script>
window.addEventListener('error', function(e){
  try{ document.documentElement.setAttribute('data-fatal', e.message+' @'+(e.lineno||'?')+':'+(e.colno||'?')); }catch(_){}
  try{ console.error('FATAL', e.message, e.lineno+':'+e.colno); }catch(_){}
});
</script>
<script>
"use strict";
(function(){
/* ============================================================================
   HARVEST IDLE — a farm-crop-selling idle sim. Single file, self-contained,
   no libraries and no image assets: every crop and tile is drawn procedurally
   into a simple 2:1 isometric grid.

   Layout of this file:
     1. constants, crop/plot definitions
     2. state — freshState/migrate/load/save
     3. derived helpers (cost curve, growth stage, formatting)
     4. canvas layout — virtual coordinate space, DPR aware, iso projection
     5. rendering — tiles, crops, locked plots, floating text, HUD
     6. actions — plant / harvest / unlock / plant-all / select-crop
     7. input — canvas click/touch, HUD delegation
     8. offline catch-up
     9. boot + main loop
============================================================================ */

/* --------------------------------------------------------- 1. constants */

var CURRENT_VERSION = 1;
var SAVE_KEY = 'harvest_save_v1';
var OFFLINE_CAP_MS = 10 * 60 * 60 * 1000;   // 10h
var AUTOSAVE_MS = 10000;
var HUD_TICK_MS = 200;

var COLS = 6, ROWS = 5;
var MAX_PLOTS = COLS * ROWS;                // 30
var START_PLOTS = 4;

var PLOT_BASE_COST = 15;
var PLOT_GROWTH = 1.35;

var REDUCED = (function(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(_){ return false; }
})();

var CROP_DEFS = [
  { key:'carrot',  name:'Carrot',       icon:'🥕', cost:2,   growMs:20 * 1000,          sellPrice:5,   unlockAt:0,     color:'#f2994a' },
  { key:'wheat',   name:'Wheat',        icon:'🌾', cost:6,   growMs:90 * 1000,          sellPrice:16,  unlockAt:150,   color:'#e0c14c' },
  { key:'corn',    name:'Corn',         icon:'🌽', cost:20,  growMs:5 * 60 * 1000,      sellPrice:55,  unlockAt:800,   color:'#eab308' },
  { key:'pumpkin', name:'Pumpkin',      icon:'🎃', cost:60,  growMs:20 * 60 * 1000,     sellPrice:180, unlockAt:4000,  color:'#f2711c' },
  { key:'grape',   name:'Golden Grape', icon:'🍇', cost:200, growMs:2 * 60 * 60 * 1000, sellPrice:900, unlockAt:20000, color:'#a78bfa' }
];

function cropByKey(key){
  for(var i=0;i<CROP_DEFS.length;i++){ if(CROP_DEFS[i].key === key) return CROP_DEFS[i]; }
  return null;
}

/* ------------------------------------------------------------- 2. state */

function freshState(){
  var plots = [];
  for(var i=0;i<MAX_PLOTS;i++){
    plots.push({ unlocked: i < START_PLOTS, cropKey:null, plantedAt:null });
  }
  return {
    version: CURRENT_VERSION,
    coins: 20,
    lifetimeCoins: 0,
    plots: plots,
    plotsUnlocked: START_PLOTS,
    selectedCrop: 'carrot',
    lastSeen: Date.now(),
    createdAt: Date.now()
  };
}

var state = freshState();
var canStore = true;

function migrate(raw){
  if(!raw.version || raw.version < CURRENT_VERSION) raw.version = CURRENT_VERSION;
  var fresh = freshState();
  for(var k in fresh){ if(!(k in raw)) raw[k] = fresh[k]; }
  if(!Array.isArray(raw.plots)) raw.plots = fresh.plots;
  while(raw.plots.length < MAX_PLOTS) raw.plots.push({ unlocked:false, cropKey:null, plantedAt:null });
  if(raw.plots.length > MAX_PLOTS) raw.plots.length = MAX_PLOTS;
  if(typeof raw.plotsUnlocked !== 'number' || raw.plotsUnlocked < 0) raw.plotsUnlocked = START_PLOTS;
  if(!cropByKey(raw.selectedCrop)) raw.selectedCrop = 'carrot';
  return raw;
}

function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(raw){ state = migrate(JSON.parse(raw)); }
  }catch(e){
    canStore = false;
  }
}

function save(){
  if(!canStore) return;
  state.lastSeen = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){ canStore = false; }
}

/* ---------------------------------------------------- 3. derived helpers */

function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

function fmt(n){
  n = Math.floor(n);
  if(n < 1000) return String(n);
  var units = ['K','M','B','T'];
  var u = -1, v = n;
  while(v >= 1000 && u < units.length - 1){ v /= 1000; u++; }
  return v.toFixed(v < 10 ? 2 : 1) + units[u];
}

function plotCost(owned){
  return Math.ceil(PLOT_BASE_COST * Math.pow(PLOT_GROWTH, owned));
}

// stage: 'seed' <15%, 'sprout' <60%, 'grown' <100%, 'ready' >=100%
function cropProgress(plot, now){
  var def = cropByKey(plot.cropKey);
  if(!def || !plot.plantedAt) return 0;
  return clamp((now - plot.plantedAt) / def.growMs, 0, 1);
}

/* ------------------------------------------------- 4. canvas + iso layout */

var VW = 620, VH = 360;
var TW = 50, TH = 26;
var TOP_PAD = 40;

function computeOrigin(){
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  var corners = [[0,0],[COLS-1,0],[0,ROWS-1],[COLS-1,ROWS-1]];
  corners.forEach(function(c){
    var col = c[0], row = c[1];
    var x = (col - row) * TW, y = (col + row) * TH;
    if(x < minX) minX = x; if(x > maxX) maxX = x;
    if(y < minY) minY = y; if(y > maxY) maxY = y;
  });
  return { x: VW/2 - (minX + maxX)/2, y: TOP_PAD - minY + TH };
}
var ORIGIN = computeOrigin();

function gridToScreen(col,row){
  return { x: ORIGIN.x + (col - row) * TW, y: ORIGIN.y + (col + row) * TH };
}

function screenToGrid(x,y){
  var dx = x - ORIGIN.x, dy = y - ORIGIN.y;
  var colF = (dx/TW + dy/TH) / 2, rowF = (dy/TH - dx/TW) / 2;
  var col = Math.round(colF), row = Math.round(rowF);
  if(col < 0 || col >= COLS || row < 0 || row >= ROWS) return -1;
  var c = gridToScreen(col,row);
  var lx = x - c.x, ly = y - c.y;
  if(Math.abs(lx)/TW + Math.abs(ly)/TH > 1) return -1;
  return row * COLS + col;
}

// draw order: back-to-front by (row+col), precomputed once
var DRAW_ORDER = [];
(function(){
  for(var i=0;i<MAX_PLOTS;i++) DRAW_ORDER.push(i);
  DRAW_ORDER.sort(function(a,b){
    var ra = Math.floor(a/COLS), ca = a % COLS, rb = Math.floor(b/COLS), cb = b % COLS;
    return (ra+ca) - (rb+cb);
  });
})();

var cv = document.getElementById('game');
var ctx = cv.getContext('2d', { alpha:false });
var stageEl = document.getElementById('stage');

function resize(){
  var rw = stageEl.clientWidth, rh = stageEl.clientHeight;
  var availW = Math.max(200, rw - 10), availH = Math.max(200, rh - 10);
  var k = Math.min(availW/VW, availH/VH);
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(VW * DPR));
  cv.height = Math.max(1, Math.round(VH * DPR));
  cv.style.width = Math.floor(VW * k) + 'px';
  cv.style.height = Math.floor(VH * k) + 'px';
  ctx.setTransform(cv.width/VW, 0, 0, cv.height/VH, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if(window.ResizeObserver){
  try{ new ResizeObserver(resize).observe(stageEl); }catch(_){}
}

/* ------------------------------------------------------------ 5. render */

var MONO_FONT = "12px 'JetBrains Mono', ui-monospace, monospace";
var COLOR_SOIL = '#4a3323';
var COLOR_SOIL_LINE = 'rgba(0,0,0,.35)';
var COLOR_LOCKED = 'rgba(255,255,255,.035)';
var COLOR_LOCKED_LINE = 'rgba(255,255,255,.08)';

function drawDiamond(cx,cy,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(cx, cy - TH);
  ctx.lineTo(cx + TW, cy);
  ctx.lineTo(cx, cy + TH);
  ctx.lineTo(cx - TW, cy);
  ctx.closePath();
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

function drawEmptyTile(cx,cy){
  drawDiamond(cx, cy, COLOR_SOIL, COLOR_SOIL_LINE);
}

function drawLockedTile(cx,cy,isNext,cost){
  drawDiamond(cx, cy, COLOR_LOCKED, COLOR_LOCKED_LINE);
  ctx.save();
  ctx.translate(cx, cy - 4);
  ctx.strokeStyle = isNext ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.22)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -3, 5, Math.PI, 0, false); ctx.stroke();
  ctx.fillStyle = isNext ? 'rgba(255,255,255,.4)' : 'rgba(255,255,255,.18)';
  ctx.fillRect(-7, -3, 14, 9);
  ctx.restore();
  if(isNext){
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.font = MONO_FONT;
    ctx.textAlign = 'center';
    ctx.fillText(fmt(cost), cx, cy + 18);
  }
}

function drawSeed(cx,cy){
  ctx.fillStyle = '#2e2016';
  ctx.beginPath(); ctx.arc(cx, cy + 4, 2.5, 0, Math.PI*2); ctx.fill();
}

function drawSprout(cx,cy,progress){
  var h = 4 + 10 * progress;
  ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy + 6); ctx.lineTo(cx, cy + 6 - h); ctx.stroke();
  ctx.fillStyle = '#4ade80';
  ctx.beginPath();
  ctx.moveTo(cx, cy + 6 - h); ctx.lineTo(cx - 4, cy + 2 - h); ctx.lineTo(cx + 2, cy + 3 - h);
  ctx.closePath(); ctx.fill();
}

function drawGrownShape(cx,cy,def,scale){
  ctx.save();
  ctx.translate(cx, cy - 6*scale);
  ctx.scale(scale, scale);
  switch(def.key){
    case 'carrot':
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(-6,-4); ctx.lineTo(6,-4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0,-4); ctx.lineTo(-3,-12);
      ctx.moveTo(0,-4); ctx.lineTo(3,-12);
      ctx.moveTo(0,-4); ctx.lineTo(0,-14);
      ctx.stroke();
      break;
    case 'wheat':
      ctx.strokeStyle = '#8a6a2a'; ctx.lineWidth = 2;
      [-6,0,6].forEach(function(off){ ctx.beginPath(); ctx.moveTo(off,14); ctx.lineTo(off*0.6,-10); ctx.stroke(); });
      ctx.fillStyle = def.color;
      [-6,0,6].forEach(function(off){ ctx.beginPath(); ctx.ellipse(off*0.6,-12,4,7,0,0,Math.PI*2); ctx.fill(); });
      break;
    case 'corn':
      ctx.fillStyle = '#4a7c2f';
      ctx.fillRect(-3,-4,6,18);
      ctx.fillStyle = def.color;
      ctx.fillRect(-5,-16,10,16);
      break;
    case 'pumpkin':
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.ellipse(0,4,11,9,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(0,13); ctx.stroke();
      ctx.fillStyle = '#5b3a29';
      ctx.fillRect(-2,-9,4,6);
      break;
    case 'grape':
      ctx.fillStyle = def.color;
      [[-5,0],[5,0],[0,-6],[-3,7],[3,7],[0,2]].forEach(function(p){
        ctx.beginPath(); ctx.arc(p[0],p[1],4,0,Math.PI*2); ctx.fill();
      });
      break;
  }
  ctx.restore();
}

function drawReadyGlow(cx,cy,now){
  var pulse = REDUCED ? 0.5 : (0.5 + 0.5 * Math.sin(now/280));
  ctx.save();
  ctx.globalAlpha = 0.3 + 0.25 * pulse;
  ctx.fillStyle = '#fef08a';
  ctx.beginPath(); ctx.arc(cx, cy - 2, 14 + 4*pulse, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

var floatTexts = [];
function spawnFloat(index, text){
  var row = Math.floor(index/COLS), col = index % COLS;
  var pos = gridToScreen(col,row);
  floatTexts.push({ x: pos.x, y: pos.y - 10, text: text, start: Date.now() });
}
function drawFloats(now){
  for(var i = floatTexts.length - 1; i >= 0; i--){
    var f = floatTexts[i];
    var t = (now - f.start) / 900;
    if(t >= 1){ floatTexts.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = '#fef08a';
    ctx.font = MONO_FONT;
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y - 20*t);
    ctx.restore();
  }
}

function renderCanvas(now){
  ctx.clearRect(0,0,VW,VH);
  ctx.fillStyle = '#12161d';
  ctx.fillRect(0,0,VW,VH);

  DRAW_ORDER.forEach(function(index){
    var row = Math.floor(index/COLS), col = index % COLS;
    var pos = gridToScreen(col,row);
    var plot = state.plots[index];

    if(index >= state.plotsUnlocked){
      var isNext = index === state.plotsUnlocked;
      drawLockedTile(pos.x, pos.y, isNext, isNext ? plotCost(state.plotsUnlocked) : 0);
      return;
    }
    if(!plot.cropKey){
      drawEmptyTile(pos.x, pos.y);
      return;
    }
    var def = cropByKey(plot.cropKey);
    var progress = cropProgress(plot, now);
    drawEmptyTile(pos.x, pos.y);
    if(progress >= 1){
      drawReadyGlow(pos.x, pos.y, now);
      drawGrownShape(pos.x, pos.y, def, 1);
    } else if(progress >= 0.6){
      var scale = 0.55 + 0.45 * ((progress - 0.6) / 0.4);
      drawGrownShape(pos.x, pos.y, def, scale);
    } else if(progress >= 0.15){
      drawSprout(pos.x, pos.y, (progress - 0.15) / 0.45);
    } else {
      drawSeed(pos.x, pos.y);
    }
  });

  drawFloats(now);
}

/* ---------------------------------------------------------- HUD render */

var cropChipsEl = document.getElementById('cropChips');
var plantAllBtn = document.getElementById('plantAllBtn');

function buildCropChips(){
  cropChipsEl.innerHTML = '';
  CROP_DEFS.forEach(function(def){
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.key = def.key;
    chip.dataset.action = 'select-crop';
    chip.style.setProperty('--chipaccent', def.color);
    chip.innerHTML =
      '<span class="ico">' + def.icon + '</span>' +
      '<span class="nm">' + def.name + '</span>' +
      '<span class="cost" data-f="cost"></span>';
    cropChipsEl.appendChild(chip);
  });
}
buildCropChips();

function renderHud(){
  document.getElementById('coinVal').textContent = fmt(state.coins);
  document.getElementById('plotsVal').textContent = state.plotsUnlocked + '/' + MAX_PLOTS + ' plots';

  CROP_DEFS.forEach(function(def){
    var chip = cropChipsEl.querySelector('[data-key="' + def.key + '"]');
    var unlocked = def.unlockAt <= state.lifetimeCoins;
    chip.classList.toggle('locked', !unlocked);
    chip.classList.toggle('active', unlocked && state.selectedCrop === def.key);
    var costEl = chip.querySelector('[data-f="cost"]');
    costEl.textContent = unlocked ? (def.cost + ' coins') : ('at ' + fmt(def.unlockAt) + ' lifetime');
  });

  var selDef = cropByKey(state.selectedCrop);
  var selUnlocked = selDef && selDef.unlockAt <= state.lifetimeCoins;
  var hasEmpty = false;
  for(var i=0;i<state.plotsUnlocked;i++){ if(!state.plots[i].cropKey){ hasEmpty = true; break; } }
  plantAllBtn.disabled = !selUnlocked || !hasEmpty || state.coins < (selDef ? selDef.cost : Infinity);
}

var toastTimer = null;
function showToast(html){
  var t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.className = 'toast'; t.id = 'toast';
    document.body.appendChild(t);
  }
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3600);
}

/* -------------------------------------------------------------- actions */

function selectCrop(key){
  var def = cropByKey(key);
  if(!def || def.unlockAt > state.lifetimeCoins) return;
  state.selectedCrop = key;
  renderHud();
}

function plantPlot(index){
  var plot = state.plots[index];
  if(!plot || !plot.unlocked || plot.cropKey) return;
  var def = cropByKey(state.selectedCrop);
  if(!def || def.unlockAt > state.lifetimeCoins) return;
  if(state.coins < def.cost) return;
  state.coins -= def.cost;
  plot.cropKey = def.key;
  plot.plantedAt = Date.now();
  save();
}

function harvestPlot(index){
  var plot = state.plots[index];
  if(!plot || !plot.cropKey) return;
  var def = cropByKey(plot.cropKey);
  if(!def) return;
  if(cropProgress(plot, Date.now()) < 1) return;
  state.coins += def.sellPrice;
  state.lifetimeCoins += def.sellPrice;
  plot.cropKey = null;
  plot.plantedAt = null;
  spawnFloat(index, '+' + fmt(def.sellPrice));
  checkUnlocks();
  save();
}

function unlockPlot(){
  if(state.plotsUnlocked >= MAX_PLOTS) return;
  var cost = plotCost(state.plotsUnlocked);
  if(state.coins < cost) return;
  state.coins -= cost;
  state.plots[state.plotsUnlocked].unlocked = true;
  state.plotsUnlocked++;
  save();
}

function plantAll(){
  var def = cropByKey(state.selectedCrop);
  if(!def || def.unlockAt > state.lifetimeCoins) return;
  var planted = 0;
  for(var i=0;i<state.plotsUnlocked;i++){
    var plot = state.plots[i];
    if(!plot.cropKey && state.coins >= def.cost){
      state.coins -= def.cost;
      plot.cropKey = def.key;
      plot.plantedAt = Date.now();
      planted++;
    }
  }
  if(planted > 0) save();
}

function handlePlotClick(index){
  var plot = state.plots[index];
  if(!plot) return;
  if(!plot.unlocked){ unlockPlot(); return; }
  if(!plot.cropKey){ plantPlot(index); return; }
  if(cropProgress(plot, Date.now()) >= 1) harvestPlot(index);
}

var unlockSeen = {};
function checkUnlocks(){
  CROP_DEFS.forEach(function(def){
    if(def.unlockAt <= state.lifetimeCoins && !unlockSeen[def.key]){
      unlockSeen[def.key] = true;
      if(unlockSeen._booted) showToast('New crop unlocked: <b>' + def.name + '</b>');
    }
  });
}
function seedUnlockSeen(){
  CROP_DEFS.forEach(function(def){
    if(def.unlockAt <= state.lifetimeCoins) unlockSeen[def.key] = true;
  });
}

/* ---------------------------------------------------------------- input */

function getCanvasPoint(e){
  var rect = cv.getBoundingClientRect();
  var cx = (e.clientX - rect.left) * (VW / rect.width);
  var cy = (e.clientY - rect.top) * (VH / rect.height);
  return { x: cx, y: cy };
}

cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  var pt = getCanvasPoint(e);
  var index = screenToGrid(pt.x, pt.y);
  if(index < 0) return;
  handlePlotClick(index);
});

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  if(action === 'select-crop') selectCrop(el.dataset.key);
  else if(action === 'plant-all') plantAll();
  else if(action === 'dismiss-offline') document.getElementById('offlineBanner').style.display = 'none';
});

/* -------------------------------------------------------- offline catch-up */

function handleOffline(){
  var elapsed = Date.now() - state.lastSeen;
  if(elapsed < 30000) return;
  var capped = Math.min(elapsed, OFFLINE_CAP_MS);
  var now = Date.now();
  var readyCount = 0;
  for(var i=0;i<state.plotsUnlocked;i++){
    var p = state.plots[i];
    if(p.cropKey && p.plantedAt && p.plantedAt <= state.lastSeen){
      var def = cropByKey(p.cropKey);
      if(def && (now - p.plantedAt) >= def.growMs) readyCount++;
    }
  }
  if(readyCount <= 0) return;
  var hrs = Math.floor(capped / 3600000), mins = Math.floor((capped % 3600000) / 60000);
  var text = 'While you were away (' + hrs + 'h ' + mins + 'm' + (elapsed > OFFLINE_CAP_MS ? ', capped' : '') + '): ' +
    '<b>' + readyCount + '</b> crop' + (readyCount === 1 ? '' : 's') + ' finished growing and ' +
    (readyCount === 1 ? 'is' : 'are') + ' ready to harvest.';
  document.getElementById('offlineText').innerHTML = text;
  document.getElementById('offlineBanner').style.display = 'block';
}

/* ------------------------------------------------------------------ boot */

load();
seedUnlockSeen();
handleOffline();
resize();
renderHud();
save();
unlockSeen._booted = true;

var lastHudTick = 0;
function loop(){
  var now = Date.now();
  renderCanvas(now);
  if(now - lastHudTick > HUD_TICK_MS){
    lastHudTick = now;
    checkUnlocks();
    renderHud();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

setInterval(save, AUTOSAVE_MS);
document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });
window.addEventListener('beforeunload', save);

})();
</script>
</body>
